version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediabuilder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediabuilder
      POSTGRES_PASSWORD: mediabuilder
      POSTGRES_DB: mediabuilder
    ports:
      - '54321:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mediabuilder']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediabuilder-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '63791:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: mediabuilder-nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/assets:/data/assets:ro
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/health']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: development
    container_name: mediabuilder-api
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://mediabuilder:mediabuilder@postgres:5432/mediabuilder?schema=public
      - REDIS_URL=redis://redis:6379
      - ASSETS_ROOT=/data/assets
      - PUBLIC_BASE_URL=http://localhost:8080/assets
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./data/assets:/data/assets
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm --filter api dev

  ws:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: development
    container_name: mediabuilder-ws
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://mediabuilder:mediabuilder@postgres:5432/mediabuilder?schema=public
      - REDIS_URL=redis://redis:6379
    ports:
      - '8081:8081'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm --filter api dev:ws

  workers:
    build:
      context: .
      dockerfile: ./apps/workers/Dockerfile
      target: development
    container_name: mediabuilder-workers
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://mediabuilder:mediabuilder@postgres:5432/mediabuilder?schema=public
      - REDIS_URL=redis://redis:6379
      - ASSETS_ROOT=/data/assets
    volumes:
      - ./apps/workers:/app/apps/workers
      - ./packages:/app/packages
      - ./data/assets:/data/assets
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm --filter workers dev

volumes:
  postgres-data:
  redis-data:
